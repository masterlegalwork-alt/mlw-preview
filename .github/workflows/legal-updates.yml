name: Legal updates
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: legal-updates
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch public RSS headlines
        run: python3 tools/fetch_updates.py .
      - name: Commit if changed
        run: |
          git config user.name "mlw-updates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/updates.json
          git diff --cached --quiet || (git commit -m "Legal updates $(date -u +%FT%TZ)" && git push)
